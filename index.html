<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Sharma Kirana Store - Ultra Edition</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">

  <script src="https://kit.fontawesome.com/a2d2706b41.js" crossorigin="anonymous"></script>
</head>

<body>

  <!-- HEADER -->
  <header class="sticky top-0 z-40 backdrop-blur-lg bg-[var(--bg)]/90 border-b border-[var(--border)]">

    <div class="flex items-center justify-between p-4">

      <div>
        <h1 class="text-xl font-bold">Sharma Kirana</h1>
        <p class="text-xs opacity-70">Promax Ultra Edition</p>
      </div>

      <!-- OTAKU TOGGLE -->
      <button id="theme-toggle" class="theme-btn">
        <i class="fa-solid fa-moon"></i>
      </button>

    </div>

    <!-- SEARCH -->
    <div class="px-4 pb-3">

      <div class="relative">

        <input
          id="search-input"
          type="text"
          placeholder="Search products..."
          class="w-full rounded-2xl px-4 py-3 outline-none bg-[var(--card)] border border-[var(--border)]"
        />

      </div>

    </div>

    <!-- CATEGORY BAR -->
    <div id="category-bar" class="category-scroll px-4 pb-3 flex gap-3 overflow-x-auto">

    </div>

  </header>

  <!-- PRODUCT GRID -->
  <main id="product-grid" class="grid grid-cols-2 gap-4 p-4 pb-32">

  </main>

  <!-- FLOATING CART -->
  <button
    id="view-cart-btn"
    class="fixed bottom-4 left-4 right-4 bg-[var(--accent)] text-white rounded-2xl py-4 font-bold shadow-xl z-50"
  >
    View Cart
  </button>

  <!-- CHECKOUT SHEET -->
  <div id="checkout-modal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm">

    <div class="checkout-sheet">

      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold">Your Cart</h2>

        <button onclick="closeCheckoutModal()">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <div id="checkout-items" class="space-y-3 max-h-80 overflow-y-auto"></div>

      <div class="mt-5 flex justify-between font-bold text-lg">
        <span>Total</span>
        <span id="checkout-total">₹0</span>
      </div>

      <button
        onclick="placeOrder()"
        class="mt-5 w-full bg-[var(--accent)] text-white py-4 rounded-2xl font-bold"
      >
        Place Order
      </button>

    </div>

  </div>

  <!-- SUCCESS MODAL -->
  <div id="success-modal" class="hidden fixed inset-0 z-[70] flex items-center justify-center bg-black/50 backdrop-blur-md">

    <div class="success-box">

      <div class="checkmark-wrapper">
        <div class="checkmark"></div>
      </div>

      <h2 class="text-2xl font-bold mt-4">Order Confirmed 🎉</h2>

      <p id="success-summary" class="mt-2 text-sm opacity-70 text-center"></p>

      <button
        onclick="closeSuccessModal()"
        class="mt-6 bg-[var(--accent)] text-white px-6 py-3 rounded-xl font-bold"
      >
        Continue Shopping
      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
