<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Sharma Kirana Store • Ultra Edition</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <script
    src="https://kit.fontawesome.com/a2d2706b41.js"
    crossorigin="anonymous"
  ></script>

</head>

<body class="min-h-screen">

  <!-- ===================== -->
  <!-- HEADER -->
  <!-- ===================== -->

  <header class="sticky top-0 z-50 backdrop-blur-xl bg-[var(--bg)]/90 border-b border-[var(--border)]">

    <div class="max-w-7xl mx-auto px-4 py-4">

      <div class="flex items-center justify-between gap-4">

        <!-- LEFT -->
        <div class="flex items-center gap-3">

          <div class="w-12 h-12 rounded-2xl bg-[var(--accent)] flex items-center justify-center shadow-lg">

            <i class="fa-solid fa-basket-shopping text-white text-lg"></i>

          </div>

          <div>

            <h1 class="text-2xl font-extrabold leading-none tracking-tight">
              Sharma Kirana
            </h1>

            <p class="text-xs opacity-60 mt-1">
              Promax Ultra Edition ✨
            </p>

          </div>

        </div>

        <!-- RIGHT -->
        <div class="flex items-center gap-3">

          <!-- OTAKU BUTTON -->
          <button
            id="theme-toggle"
            class="theme-btn"
          >

            <i class="fa-solid fa-moon"></i>

          </button>

          <!-- PROFILE -->
          <div class="relative">

            <button
              id="profile-btn"
              class="relative"
            >

              <img
                src="https://i.pinimg.com/736x/28/8b/91/288b917391f9b2c07be1c3e05c654220.jpg"
                class="w-12 h-12 rounded-full object-cover border-2 border-pink-400 shadow-lg"
              >

              <span class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-green-500 border-2 border-white"></span>

            </button>

            <!-- PROFILE MENU -->
            <div
              id="profile-menu"
              class="hidden absolute right-0 mt-4 w-72 bg-white rounded-3xl shadow-2xl overflow-hidden"
            >

              <!-- TOP -->
              <div class="p-5 bg-gradient-to-r from-pink-400 to-blue-400 text-white">

                <div class="flex items-center gap-4">

                  <img
                    src="https://i.pinimg.com/736x/28/8b/91/288b917391f9b2c07be1c3e05c654220.jpg"
                    class="w-16 h-16 rounded-full border-2 border-white object-cover"
                  >

                  <div>

                    <h3 class="font-bold text-lg">
                      Hello, User!
                    </h3>

                    <p class="text-sm opacity-90">
                      Welcome back ✨
                    </p>

                  </div>

                </div>

              </div>

              <!-- MENU -->
              <div class="p-3 text-black">

                <button class="menu-item">
                  <i class="fa-regular fa-user"></i>
                  <span>My Profile</span>
                </button>

                <button class="menu-item">
                  <i class="fa-solid fa-box"></i>
                  <span>Orders</span>
                </button>

                <button class="menu-item">
                  <i class="fa-solid fa-location-dot"></i>
                  <span>Addresses</span>
                </button>

                <button class="menu-item">
                  <i class="fa-solid fa-gear"></i>
                  <span>Settings</span>
                </button>

                <button class="menu-item text-red-500">
                  <i class="fa-solid fa-right-from-bracket"></i>
                  <span>Logout</span>
                </button>

              </div>

            </div>

          </div>

        </div>

      </div>

      <!-- SEARCH -->
      <div class="mt-5">

        <div class="relative">

          <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 opacity-50"></i>

          <input
            id="search-input"
            type="text"
            placeholder="Search products..."
            class="w-full rounded-3xl bg-[var(--card)] border border-[var(--border)] py-4 pl-14 pr-5 outline-none text-sm"
          >

        </div>

      </div>

    </div>

  </header>

  <!-- ===================== -->
  <!-- CATEGORIES -->
  <!-- ===================== -->

  <section class="max-w-7xl mx-auto px-4 mt-5">

    <div class="flex items-center justify-between mb-4">

      <h2 class="font-bold text-lg">
        Categories
      </h2>

      <button class="text-sm opacity-70">
        See All
      </button>

    </div>

    <div
      id="category-bar"
      class="category-scroll flex gap-3 overflow-x-auto pb-2"
    >

    </div>

  </section>

  <!-- ===================== -->
  <!-- PRODUCTS -->
  <!-- ===================== -->

  <section class="max-w-7xl mx-auto px-4 mt-7 pb-32">

    <div class="flex items-center justify-between mb-5">

      <h2 class="font-bold text-xl">
        Top Picks For You
      </h2>

      <button class="text-sm opacity-70">
        View More
      </button>

    </div>

    <main
      id="product-grid"
      class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"
    >

    </main>

  </section>

  <!-- ===================== -->
  <!-- FLOATING CART -->
  <!-- ===================== -->

  <button
    id="view-cart-btn"
    class="fixed bottom-4 left-4 right-4 md:left-1/2 md:-translate-x-1/2 md:max-w-3xl bg-[var(--accent)] text-white rounded-2xl py-4 px-6 font-bold shadow-2xl flex items-center justify-between z-50"
  >

    <div class="flex items-center gap-3">

      <i class="fa-solid fa-cart-shopping"></i>

      <span>
        View Cart
      </span>

    </div>

    <span id="cart-total-price">
      ₹0
    </span>

  </button>

  <!-- ===================== -->
  <!-- CHECKOUT MODAL -->
  <!-- ===================== -->

  <div
    id="checkout-modal"
    class="hidden fixed inset-0 z-[70] bg-black/50 backdrop-blur-sm"
  >

    <div class="checkout-sheet">

      <div class="flex items-center justify-between mb-5">

        <h2 class="font-bold text-xl">
          Your Cart 🛒
        </h2>

        <button onclick="closeCheckoutModal()">

          <i class="fa-solid fa-xmark text-xl"></i>

        </button>

      </div>

      <div
        id="checkout-items"
        class="space-y-4 max-h-80 overflow-y-auto"
      ></div>

      <div class="mt-6 border-t pt-5">

        <div class="flex justify-between font-bold text-lg">

          <span>Total</span>

          <span id="checkout-total">
            ₹0
          </span>

        </div>

        <button
          onclick="placeOrder()"
          class="mt-5 w-full bg-[var(--accent)] text-white py-4 rounded-2xl font-bold"
        >

          Place Order 🚀

        </button>

      </div>

    </div>

  </div>

  <!-- ===================== -->
  <!-- SUCCESS MODAL -->
  <!-- ===================== -->

  <div
    id="success-modal"
    class="hidden fixed inset-0 z-[80] bg-black/50 backdrop-blur-md flex items-center justify-center px-4"
  >

    <div class="success-box">

      <div class="checkmark-wrapper">

        <div class="checkmark"></div>

      </div>

      <h2 class="text-3xl font-extrabold mt-6">
        Order Confirmed 🎉
      </h2>

      <p
        id="success-summary"
        class="mt-3 opacity-70 text-sm leading-relaxed"
      ></p>

      <button
        onclick="closeSuccessModal()"
        class="mt-6 bg-[var(--accent)] text-white px-7 py-3 rounded-2xl font-bold"
      >

        Continue Shopping

      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
